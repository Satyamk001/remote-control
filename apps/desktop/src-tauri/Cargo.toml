[package]
name = "desktop"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "window-set-fullscreen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

remote-core = { path = "../../../crates/remote-core" }
networking = { path = "../../../crates/networking" }
webrtc_lib = { path = "../../../crates/webrtc", package = "webrtc" }
webrtc = "0.11"
hex = "0.4"
bincode = "1.3"
crc32fast = "1.3"
input = { path = "../../../crates/input" }
screen-capture = { path = "../../../crates/screen-capture" }
video = { path = "../../../crates/video" }

[features]
custom-protocol = ["tauri/custom-protocol"]
