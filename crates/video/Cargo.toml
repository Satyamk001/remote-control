[package]
name = "video"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
screen-capture = { path = "../screen-capture" }
networking = { path = "../networking" }
flate2 = "1.0"
openh264 = "0.6"
windows = { version = "0.52", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
