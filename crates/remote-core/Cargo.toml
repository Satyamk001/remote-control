[package]
name = "remote-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
async-trait = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
arboard = "3.3"
crc32fast = "1.3"
cpal = "0.15"
ringbuf = "0.3"
bytemuck = "1"

screen-capture = { path = "../screen-capture" }
video = { path = "../video" }
networking = { path = "../networking" }
