[package]
name = "networking"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.5"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
tokio-tungstenite = "0.20"
futures-util = "0.3"
url = "2.4"
serde_json = "1.0"
